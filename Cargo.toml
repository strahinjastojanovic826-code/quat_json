[package]
name = "quat_json"
version = "0.3.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "A high-performance quaternary JSON processing and compression library with universal FFI support"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/strahinjastojanovic826-code/quat_json"
keywords = ["json", "quaternary", "compression", "parser", "ffi"]
categories = ["encoding", "parser-implementations", "data-structures"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
